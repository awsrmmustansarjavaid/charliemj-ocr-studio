name: Repair malformed ui.py syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Repair exact syntax error
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/ui.py')
          s = p.read_text(encoding='utf-8')
          bad = '                         ("Copy Plain", lambda: self.copy(layout.to_plain(self.combined_text())),\n'
          good = '                         ("Copy Plain", lambda: self.copy(layout.to_plain(self.combined_text()))),\n'
          if bad not in s:
              raise SystemExit('Expected malformed Copy Plain line was not found; refusing to modify ui.py.')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')

      - name: Validate all Python modules
        shell: bash
        run: python -m compileall -q app main.py tests

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/ui.py
          git commit -m "Fix ui.py syntax error before packaging"
          git rm .github/workflows/repair-ui-syntax.yml
          git commit -m "Remove temporary UI repair workflow"
          git push
