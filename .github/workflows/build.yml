# =============================================================================
# build.yml - GitHub Actions workflow
# Builds the portable Windows .exe in the cloud so no local setup is needed, and
# does it transparently (you can read every step) with several safety checks.
#
# How to use: open the repository's "Actions" tab -> "Build Windows portable EXE"
# -> "Run workflow". When it finishes, download the artifact at the bottom of
# the run page: CharlieMJ-OCR-Portable (a .zip with the app + SHA256SUMS.txt).
# =============================================================================

name: Build Windows portable EXE

# Triggers: manual button press, and every push to the main branch
on:
  workflow_dispatch:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repository
permissions:
  contents: read

jobs:
  build:
    # A Windows runner is required because PyInstaller cannot cross-compile
    runs-on: windows-latest

    steps:
      # 1. Download this repository's code onto the runner
      - uses: actions/checkout@v4

      # 2. Install Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install the Tesseract OCR engine using Chocolatey (preinstalled on the runner)
      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      # 4. Copy Tesseract into ./tesseract and add language data for
      #    English, Turkish, Urdu, Arabic and Persian (small "fast" models)
      - name: Prepare bundled Tesseract + language data
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\Tesseract-OCR" -Destination tesseract -Recurse
          # Keep the zip small and the antivirus surface minimal: the OCR app only needs
          # tesseract.exe + its DLLs + tessdata. Remove the training tools and documentation.
          Get-ChildItem tesseract -Filter *.exe | Where-Object Name -ne "tesseract.exe" | Remove-Item
          Remove-Item tesseract\doc -Recurse -ErrorAction SilentlyContinue
          $base = "https://github.com/tesseract-ocr/tessdata_fast/raw/main"
          foreach ($l in "eng","tur","urd","ara","fas") {
            Invoke-WebRequest "$base/$l.traineddata" -OutFile "tesseract\tessdata\$l.traineddata"
          }
          # Fail early if a language is missing
          $langs = & "tesseract\tesseract.exe" --list-langs
          foreach ($l in "eng","tur","urd","ara","fas") {
            if ($langs -notcontains $l) { throw "Language $l is missing" }
          }

      # 5. Install the PINNED dependencies and run the unit tests (build stops if they fail):
      #    layout analysis + rich-text model (pure Python, deterministic)
      - name: Install dependencies and unit tests
        shell: pwsh
        run: |
          pip install -r requirements-build.txt
          python -m unittest tests.test_layout tests.test_richtext -v

      # 5b. Real-OCR test on a generated poster. Informational only: a font or Tesseract-data
      #     difference on the runner must not block the build. Check the log if it fails.
      - name: OCR integration test (informational)
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_ocr_integration -v

      # 6. Build the .exe. --noupx avoids UPX compression (a common antivirus trigger);
      #    --version-file embeds publisher/product details in the exe.
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --noconsole --onedir --noupx --name CharlieMJ-OCR `
            --version-file version_info.txt --collect-all customtkinter main.py
          Copy-Item tesseract -Destination dist\CharlieMJ-OCR\tesseract -Recurse

      # 7. Scan the result with Microsoft Defender on the runner (informational:
      #    a runner problem must not hide the build, so errors do not fail the job)
      - name: Defender scan
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\dist\CharlieMJ-OCR" -DisableRemediation
          Write-Host "Defender exit code: $LASTEXITCODE (0 = no threats found)"

      # 8. Publish SHA256 checksums of every file, so the download can be verified
      - name: Checksums and zip
        shell: pwsh
        run: |
          Get-ChildItem dist\CharlieMJ-OCR -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring($PWD.Path.Length + 1))" } |
            Set-Content dist\CharlieMJ-OCR\SHA256SUMS.txt
          Compress-Archive -Path dist\CharlieMJ-OCR -DestinationPath CharlieMJ-OCR-Portable.zip

      # 9. Make the zip downloadable from the run page
      - uses: actions/upload-artifact@v4
        with:
          name: CharlieMJ-OCR-Portable
          path: CharlieMJ-OCR-Portable.zip
