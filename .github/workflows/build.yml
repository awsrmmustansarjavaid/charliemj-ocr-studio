name: Build Windows portable EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      - name: Prepare bundled Tesseract + language data
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\Tesseract-OCR" -Destination tesseract -Recurse
          Get-ChildItem tesseract -Filter *.exe | Where-Object Name -ne "tesseract.exe" | Remove-Item
          Remove-Item tesseract\doc -Recurse -ErrorAction SilentlyContinue
          $base = "https://github.com/tesseract-ocr/tessdata_best/raw/main"
          foreach ($l in "eng","tur","urd","ara","fas") {
            Invoke-WebRequest "$base/$l.traineddata" -OutFile "tesseract\tessdata\$l.traineddata"
          }
          $langs = & "tesseract\tesseract.exe" --list-langs
          foreach ($l in "eng","tur","urd","ara","fas") {
            if ($langs -notcontains $l) { throw "Language $l is missing" }
          }

      - name: Install dependencies and run complete regression suite
        shell: pwsh
        run: |
          pip install -r requirements-build.txt
          python -m unittest discover -s tests -v

      - name: OCR integration test (informational)
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_ocr_integration -v

      - name: Build EXE
        shell: pwsh
        run: .\build.bat

      - name: Smoke-test packaged EXE startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\CharlieMJ-OCR\CharlieMJ-OCR.exe"
          if (-not (Test-Path $exe)) {
            throw "Packaged EXE not found: $exe"
          }

          # A successful PyInstaller build is not enough: the GUI must survive its
          # real frozen import phase. This catches missing hidden imports such as
          # app.selector. The GUI is expected to remain running, so a live process
          # after the grace period is a successful startup smoke test.
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            throw "Packaged EXE exited during startup with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "Packaged EXE remained running for the startup smoke test."

      - name: Defender scan
        shell: pwsh
        run: |
          $scanPath = Join-Path $env:GITHUB_WORKSPACE "dist\CharlieMJ-OCR"
          if (-not (Test-Path $scanPath)) {
            Write-Warning "Defender scan skipped because $scanPath does not exist."
            exit 0
          }

          $baseline = @()
          try {
            $baseline = @(Get-MpThreatDetection -ErrorAction Stop | ForEach-Object {
              "{0}|{1}|{2}" -f $_.ThreatID, $_.InitialDetectionTime, $_.Resources
            })
          }
          catch {
            Write-Warning "Could not read the Defender baseline: $($_.Exception.Message)"
          }

          $scanStarted = $false
          try {
            Start-MpScan -ScanPath $scanPath -ScanType CustomScan -ErrorAction Stop
            $scanStarted = $true
            Write-Host "Microsoft Defender scan completed."
          }
          catch {
            Write-Warning "Microsoft Defender could not complete the custom scan on this runner: $($_.Exception.Message)"
            Write-Warning "Treating this as a Defender infrastructure error; continuing to artifact packaging."
          }

          try {
            $after = @(Get-MpThreatDetection -ErrorAction Stop | ForEach-Object {
              "{0}|{1}|{2}" -f $_.ThreatID, $_.InitialDetectionTime, $_.Resources
            })
            $newDetections = @($after | Where-Object { $baseline -notcontains $_ })
            if ($newDetections.Count -gt 0) {
              Write-Error "Microsoft Defender reported $($newDetections.Count) new threat detection(s):"
              $newDetections | ForEach-Object { Write-Error $_ }
              exit 1
            }
            if ($scanStarted) {
              Write-Host "No new Microsoft Defender threat detections were reported."
            }
            else {
              Write-Warning "Defender scan did not run, so no scan-success claim is being made."
            }
          }
          catch {
            Write-Warning "Could not query Defender detections after the scan: $($_.Exception.Message)"
            Write-Warning "Treating this as a Defender infrastructure error; continuing to artifact packaging."
          }

      - name: Checksums and final v2 zip
        shell: pwsh
        run: |
          $distPath = "dist\CharlieMJ-OCR"
          if (Test-Path $distPath) {
            $checksumPath = Join-Path $distPath "SHA256SUMS.txt"
            $checksumTempPath = Join-Path $distPath "SHA256SUMS.txt.tmp"
            $distRoot = (Resolve-Path $distPath).Path
            if (Test-Path $checksumPath) { Remove-Item $checksumPath -Force }
            if (Test-Path $checksumTempPath) { Remove-Item $checksumTempPath -Force }
            Get-ChildItem -Path $distPath -Recurse -File |
              Where-Object Name -ne "SHA256SUMS.txt" |
              Get-FileHash -Algorithm SHA256 |
              ForEach-Object { "{0} *{1}" -f $_.Hash, $_.Path.Substring($distRoot.Length + 1) } |
              Set-Content -Path $checksumTempPath -Encoding UTF8
            Move-Item -Path $checksumTempPath -Destination $checksumPath -Force

            if (Test-Path "charliemj-ocr-studio-v2-final.zip") { Remove-Item "charliemj-ocr-studio-v2-final.zip" -Force }
            Compress-Archive -Path "$distPath\*" -DestinationPath "charliemj-ocr-studio-v2-final.zip" -CompressionLevel Optimal
            if (-not (Test-Path "charliemj-ocr-studio-v2-final.zip")) {
              throw "Final ZIP was not created."
            }
          }

      - name: Run actions/upload-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: charliemj-ocr-studio-v2-final
          path: |
            charliemj-ocr-studio-v2-final.zip
            dist/CharlieMJ-OCR/SHA256SUMS.txt
          if-no-files-found: error
