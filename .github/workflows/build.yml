# =============================================================================
# build.yml - reproducible Windows v2 portable build
# =============================================================================
name: Build Windows portable EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract
        run: choco install tesseract -y --no-progress

      - name: Prepare bundled Tesseract + language data
        shell: pwsh
        run: |
          Copy-Item "C:\Program Files\Tesseract-OCR" -Destination tesseract -Recurse
          Get-ChildItem tesseract -Filter *.exe | Where-Object Name -ne "tesseract.exe" | Remove-Item
          Remove-Item tesseract\doc -Recurse -ErrorAction SilentlyContinue
          $base = "https://github.com/tesseract-ocr/tessdata_fast/raw/main"
          foreach ($l in "eng","tur","urd","ara","fas") {
            Invoke-WebRequest "$base/$l.traineddata" -OutFile "tesseract\tessdata\$l.traineddata"
          }
          $langs = & "tesseract\tesseract.exe" --list-langs
          foreach ($l in "eng","tur","urd","ara","fas") {
            if ($langs -notcontains $l) { throw "Language $l is missing" }
          }

      - name: Install dependencies and run complete regression suite
        shell: pwsh
        run: |
          pip install -r requirements-build.txt
          python -m unittest discover -s tests -v

      - name: OCR integration test (informational)
        shell: pwsh
        continue-on-error: true
        run: python -m unittest tests.test_ocr_integration -v

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --noconsole --onedir --noupx --name CharlieMJ-OCR `
            --version-file version_info.txt --collect-all customtkinter main.py
          Copy-Item tesseract -Destination dist\CharlieMJ-OCR\tesseract -Recurse

      - name: Defender scan
        shell: pwsh
        continue-on-error: true
        run: |
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\dist\CharlieMJ-OCR" -DisableRemediation
          Write-Host "Defender exit code: $LASTEXITCODE (0 = no threats found)"

      - name: Checksums and final v2 zip
        shell: pwsh
        run: |
          Get-ChildItem dist\CharlieMJ-OCR -Recurse -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($_.Path.Substring($PWD.Path.Length + 1))" } |
            Set-Content dist\CharlieMJ-OCR\SHA256SUMS.txt
          Compress-Archive -Path dist\CharlieMJ-OCR -DestinationPath charliemj-ocr-studio-v2-final.zip

      - uses: actions/upload-artifact@v4
        with:
          name: charliemj-ocr-studio-v2-final
          path: charliemj-ocr-studio-v2-final.zip
