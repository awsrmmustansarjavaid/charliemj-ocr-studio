name: Repair OCR UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, '[repair]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore UI from previous commit and apply targeted reliability fix
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:app/ui.py > app/ui.py
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ui.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for scale in ((None, 3) if level == "Deep" else (None,)):
            words, g = ocr_engine.read_words(img, code, scale)
            reader = None if level == "Fast" else ocr_engine.make_cell_reader(g, code, c1, c2)
            res = layout.analyze(words, cfg["lang"], cfg["min_conf"], ocr_engine.make_refiner(g, c1, c2), reader,
                                 min_pairs=min_pairs, size=g.size, deep=(level == "Deep"))
            if best is None or layout.score(res) > layout.score(best):
                best = res
            if res.kind != "bilingual" or (not res.unread and not res.low):
                break
        return best
'''
          new = '''        scales = (None, 3) if level == "Deep" else (None,)
        for scale in scales:
            words, g = ocr_engine.read_words(img, code, scale)
            reader = None if level == "Fast" else ocr_engine.make_cell_reader(g, code, c1, c2)
            res = layout.analyze(words, cfg["lang"], cfg["min_conf"], ocr_engine.make_refiner(g, c1, c2), reader,
                                 min_pairs=min_pairs, size=g.size, deep=(level == "Deep"))
            if best is None or layout.score(res) > layout.score(best):
                best = res
            if res.kind == "bilingual" and not res.unread and not res.low:
                break
            # Balanced mode gets one recovery pass for dense screenshots that OCR'd as
            # clean text instead of a bilingual grid. This is deliberately conditional so
            # ordinary prose does not pay the extra full-image OCR cost.
            if level == "Balanced" and scale is None and res.kind == "text" and len(res.lines) >= 6:
                words2, g2 = ocr_engine.read_words(img, code, 3)
                reader2 = ocr_engine.make_cell_reader(g2, code, c1, c2)
                res2 = layout.analyze(words2, cfg["lang"], cfg["min_conf"], ocr_engine.make_refiner(g2, c1, c2), reader2,
                                       min_pairs=min_pairs, size=g2.size, deep=True)
                if layout.score(res2) > layout.score(best):
                    best = res2
                if res2.kind == "bilingual" and not res2.unread and not res2.low:
                    break
        return best
'''
          if old not in s:
              raise SystemExit('Target smart() block not found; refusing to modify the file.')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile app/ui.py

      - name: Commit repaired UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-ui.yml
          git add app/ui.py .github/workflows/repair-ui.yml
          git commit -m "[repair] restore UI and improve Smart OCR recovery"
          git push
