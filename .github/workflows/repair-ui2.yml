name: Repair UI File

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, '[repair]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore app/ui.py from parent commit
        run: git checkout HEAD^ -- app/ui.py

      - name: Verify Python syntax
        run: python -m py_compile app/ui.py

      - name: Commit restored UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-ui.yml .github/workflows/repair-ui2.yml
          git add app/ui.py .github/workflows/repair-ui.yml .github/workflows/repair-ui2.yml
          git commit -m "[repair] restore working OCR UI"
          git push
