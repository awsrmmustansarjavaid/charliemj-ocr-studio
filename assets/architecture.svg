<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Architecture overview of Charlie MJ OCR & Language Studio v1.2 (four panels, three OCR modes) -->
  <rect width="1200" height="660" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="46" font-size="30" font-weight="700" fill="#fff">Architecture overview · v1.2</text>

    <!-- Layer 1: the four panels -->
    <text x="60" y="84" font-size="15" fill="#94a3b8" text-anchor="start">PRESENTATION  ·  app/ui.py  +  app/editor.py  +  app/selector.py  (CustomTkinter)</text>
    <g font-size="17" font-weight="700" fill="#fff">
      <rect x="60"  y="96" width="255" height="86" rx="12" fill="#1e3a8a"/><text x="187" y="128">1 INPUT</text>
      <text x="187" y="156" font-size="14" font-weight="400" fill="#bfdbfe">queue · Image N · ▲▼ · batch</text>
      <rect x="335" y="96" width="255" height="86" rx="12" fill="#1d4ed8"/><text x="462" y="128">2 PREVIEW</text>
      <text x="462" y="156" font-size="14" font-weight="400" fill="#bfdbfe">Smart | Raw | AI Smart · ✂ Select Area</text>
      <rect x="610" y="96" width="255" height="86" rx="12" fill="#5b21b6"/><text x="737" y="128">3 OCR RESULTS</text>
      <text x="737" y="156" font-size="14" font-weight="400" fill="#ddd6fe">one card per image · Swap · Copy</text>
      <rect x="885" y="96" width="255" height="86" rx="12" fill="#7c3aed"/><text x="1012" y="128">4 TEXT EDITOR</text>
      <text x="1012" y="156" font-size="14" font-weight="400" fill="#ede9fe">format · find · export MD/HTML/DOCX</text>
    </g>

    <!-- Layer 2: pure-Python core -->
    <text x="60" y="222" font-size="15" fill="#94a3b8" text-anchor="start">CORE LOGIC  ·  pure Python, unit-tested, no GUI</text>
    <rect x="60"  y="234" width="360" height="96" rx="12" fill="#065f46"/>
    <text x="240" y="268" font-size="19" font-weight="700" fill="#fff">layout.py</text>
    <text x="240" y="298" font-size="14" fill="#a7f3d0">segments · pairs · grid fill · heading · tables · notes</text>
    <rect x="420" y="234" width="360" height="96" rx="12" fill="#047857"/>
    <text x="600" y="268" font-size="19" font-weight="700" fill="#fff">richtext.py</text>
    <text x="600" y="298" font-size="14" fill="#a7f3d0">Block / Run model · MD · TXT · HTML · DOCX · CSV pairs</text>
    <rect x="780" y="234" width="360" height="96" rx="12" fill="#0f766e"/>
    <text x="960" y="268" font-size="19" font-weight="700" fill="#fff">prompts.py · config.py</text>
    <text x="960" y="298" font-size="14" fill="#99f6e4">AI instructions · settings · constants</text>

    <!-- Layer 3: engines -->
    <text x="60" y="370" font-size="15" fill="#94a3b8" text-anchor="start">ENGINES</text>
    <rect x="60"  y="382" width="560" height="96" rx="12" fill="#14532d"/>
    <text x="340" y="416" font-size="19" font-weight="700" fill="#fff">ocr_engine.py  →  Tesseract (bundled, offline)</text>
    <text x="340" y="446" font-size="14" fill="#bbf7d0">words + boxes · Raw (2 passes) · cell re-reading · tur / urd / ara / fas / eng</text>
    <rect x="640" y="382" width="500" height="96" rx="12" fill="#9a3412"/>
    <text x="890" y="416" font-size="19" font-weight="700" fill="#fff">local_ai.py  →  Ollama (localhost only)</text>
    <text x="890" y="446" font-size="14" fill="#fed7aa">optional · AI Smart · editor AI buttons · no cloud</text>

    <!-- Threading + data -->
    <rect x="60" y="506" width="1080" height="64" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="600" y="534" font-size="16" font-weight="700" fill="#e2e8f0">Worker threads → post() → queue → poll() on the UI thread</text>
    <text x="600" y="557" font-size="14" fill="#94a3b8">OCR and AI never block the window; widgets are only touched by the UI thread</text>

    <text x="600" y="612" font-size="15" fill="#cbd5e1">Flow:  Input → Queue → OCR mode → Result cards → (auto) Text Editor → Copy / Export</text>
    <text x="600" y="638" font-size="14" fill="#64748b">Everything left of "Ollama" works offline · settings and Tesseract live next to the .exe (portable)</text>
  </g>
</svg>
