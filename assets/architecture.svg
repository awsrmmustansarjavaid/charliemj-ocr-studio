<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Layered architecture of Charlie MJ OCR & Language Studio -->
  <rect width="1100" height="660" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="550" y="48" font-size="30" font-weight="700" fill="#fff">Architecture Overview</text>
    <rect x="60" y="80" width="980" height="100" rx="14" fill="#1e3a8a"/>
    <text x="550" y="115" font-size="22" font-weight="700" fill="#fff">Presentation · app/ui.py (CustomTkinter)</text>
    <text x="550" y="148" font-size="17" fill="#bfdbfe">Image queue  |  Preview  |  Per-image result cards  |  Combined view  |  Settings</text>
    <rect x="60" y="200" width="980" height="100" rx="14" fill="#4c1d95"/>
    <text x="550" y="235" font-size="22" font-weight="700" fill="#fff">Application logic · App class</text>
    <text x="550" y="268" font-size="17" fill="#ddd6fe">Queue &amp; numbering  |  Screenshot snipper  |  Export  |  Worker threads + UI queue</text>
    <rect x="60" y="320" width="480" height="110" rx="14" fill="#065f46"/>
    <text x="300" y="358" font-size="22" font-weight="700" fill="#fff">Smart OCR (local)</text>
    <text x="300" y="390" font-size="17" fill="#a7f3d0">ocr_engine.py: words + boxes + cell re-read</text>
    <text x="300" y="414" font-size="17" fill="#a7f3d0">layout.py: segments → pairs → table</text>
    <rect x="560" y="320" width="480" height="110" rx="14" fill="#9a3412"/>
    <text x="800" y="358" font-size="22" font-weight="700" fill="#fff">Optional local AI</text>
    <text x="800" y="390" font-size="17" fill="#fed7aa">local_ai.py: Ollama on localhost only</text>
    <text x="800" y="414" font-size="17" fill="#fed7aa">prompt table ACTIONS (ui.py)</text>
    <rect x="60" y="450" width="480" height="100" rx="14" fill="#14532d"/>
    <text x="300" y="490" font-size="22" font-weight="700" fill="#fff">Tesseract OCR engine</text>
    <text x="300" y="522" font-size="17" fill="#bbf7d0">Bundled · offline · tur / urd / ara / fas / eng</text>
    <rect x="560" y="450" width="480" height="100" rx="14" fill="#7c2d12"/>
    <text x="800" y="490" font-size="22" font-weight="700" fill="#fff">Ollama (separate program)</text>
    <text x="800" y="522" font-size="17" fill="#fdba74">127.0.0.1:11434 · your model · no internet</text>
    <text x="550" y="600" font-size="18" fill="#94a3b8">config.py: settings stored beside the .exe (config.json)</text>
  </g>
</svg>
