<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Before / after: messy plain OCR vs Smart OCR (example from a real "Types of Gloves" post) -->
  <rect width="1200" height="560" fill="#0f172a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="600" y="46" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Why Smart OCR? Same image, two results</text>
    <!-- BEFORE -->
    <rect x="40" y="75" width="540" height="440" rx="14" fill="#3b1d1d" stroke="#b91c1c" stroke-width="2"/>
    <text x="70" y="115" font-size="22" font-weight="700" fill="#fca5a5">✕ Plain OCR - relationships lost</text>
    <g font-family="Consolas, monospace" font-size="17" fill="#fecaca">
      <text x="70" y="160">all SS 10 Ga! 7:36</text>
      <text x="70" y="190">kışlık eldiven (Oo muayeneeldiveni</text>
      <text x="70" y="220">(temizlik eldiveni iş eldiveni</text>
      <text x="70" y="250">winter gloves medical gloves cleaning</text>
      <text x="70" y="280">gloves work gloves</text>
      <text x="70" y="320">__</text>
      <text x="70" y="350">deri eldiven bahce eldiveni fırın eldiveni</text>
      <text x="70" y="380">leather gloves gardening gloves oven mitts</text>
      <text x="70" y="420">O08 Q G2 Ve W</text>
      <text x="70" y="450">O) O &lt;   &lt;ll</text>
    </g>
    <text x="70" y="495" font-size="16" fill="#fca5a5">Columns merged, translations separated, noise mixed in</text>
    <!-- AFTER -->
    <rect x="620" y="75" width="540" height="440" rx="14" fill="#10331f" stroke="#16a34a" stroke-width="2"/>
    <text x="650" y="115" font-size="22" font-weight="700" fill="#86efac">✓ Smart OCR - structure rebuilt</text>
    <g xml:space="preserve" font-family="Consolas, monospace" font-size="17" fill="#dcfce7">
      <text x="650" y="160">### ELDİVEN ÇEŞİTLERİ</text>
      <text x="650" y="185" fill="#86efac">*Types of Gloves*</text>
      <text x="650" y="225">| # | Turkish            | English          |</text>
      <text x="650" y="250">|---|--------------------|------------------|</text>
      <text x="650" y="275">| 1 | kışlık eldiven     | winter gloves    |</text>
      <text x="650" y="300">| 2 | muayene eldiveni   | medical gloves   |</text>
      <text x="650" y="325">| 3 | temizlik eldiveni  | cleaning gloves  |</text>
      <text x="650" y="350">| 4 | iş eldiveni        | work gloves      |</text>
      <text x="650" y="375">| 5 | deri eldiven       | leather gloves   |</text>
      <text x="650" y="400">| 6 | bahçe eldiveni     | gardening gloves |</text>
      <text x="650" y="425">| … | …                  | …                |</text>
    </g>
    <text x="650" y="495" font-size="16" fill="#86efac">Pairs found by position · noise removed · cells re-read</text>
  </g>
</svg>
